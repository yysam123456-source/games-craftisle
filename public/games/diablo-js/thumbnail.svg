<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Diablo JS thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#050403"/>
    </linearGradient>
    <radialGradient id="torch" cx="50%" cy="62%" r="46%">
      <stop offset="0" stop-color="#d96500" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d96500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#torch)"/>

  <!-- isometric dungeon floor -->
  <g stroke="#4a3a28" stroke-width="1">
    <path d="M200 60 L272 100 L200 140 L128 100 Z" fill="#2c2318"/>
    <path d="M200 100 L272 140 L200 180 L128 140 Z" fill="#241d14"/>
    <path d="M200 140 L272 180 L200 220 L128 180 Z" fill="#2c2318"/>
    <path d="M200 180 L272 220 L200 260 L128 220 Z" fill="#1c1610"/>
  </g>

  <!-- stone wall blocks -->
  <g shape-rendering="crispEdges">
    <rect x="120" y="92" width="28" height="18" fill="#6b5a44"/>
    <rect x="120" y="74" width="28" height="18" fill="#7d6b52"/>
    <rect x="252" y="92" width="28" height="18" fill="#6b5a44"/>
    <rect x="252" y="110" width="28" height="18" fill="#5a4b38"/>
    <rect x="120" y="186" width="28" height="18" fill="#6b5a44"/>
    <rect x="252" y="204" width="28" height="18" fill="#5a4b38"/>
  </g>

  <!-- hero -->
  <g>
    <polygon points="200,150 210,156 210,170 200,176 190,170 190,156" fill="#c9a227"/>
    <polygon points="200,146 206,150 206,158 200,162 194,158 194,150" fill="#8c6d1f"/>
    <rect x="209" y="150" width="4" height="22" fill="#9aa0a6"/>
    <rect x="212" y="150" width="4" height="9" fill="#d8dde2"/>
  </g>

  <!-- monsters closing in -->
  <g opacity="0.95">
    <polygon points="164,192 173,197 173,209 164,214 155,209 155,197" fill="#5c2b2b"/>
    <polygon points="164,189 169,192 169,198 164,201 159,198 159,192" fill="#7d3a3a"/>
    <polygon points="240,206 249,211 249,223 240,228 231,223 231,211" fill="#5c2b2b"/>
    <polygon points="240,203 245,206 245,212 240,215 235,212 235,206" fill="#7d3a3a"/>
  </g>

  <!-- dropped loot -->
  <circle cx="176" cy="150" r="5" fill="#e8c33c"/>
  <circle cx="176" cy="150" r="2" fill="#fff3c4"/>
  <rect x="222" y="146" width="7" height="10" fill="#7fb7d4" opacity="0.9"/>

  <text x="200" y="288" text-anchor="middle" font-family="Verdana,Geneva,sans-serif"
        font-size="21" font-weight="bold" fill="#a99877" letter-spacing="5">DIABLO JS</text>
</svg>