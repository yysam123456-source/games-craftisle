<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Sopwith - classic bi-plane shoot-em-up">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7fb5"/>
      <stop offset="0.55" stop-color="#7fa9cf"/>
      <stop offset="1" stop-color="#b9d3e6"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7f42"/>
      <stop offset="1" stop-color="#33501f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- distant cloud band -->
  <g fill="#ffffff" opacity="0.45">
    <ellipse cx="120" cy="70" rx="62" ry="20"/>
    <ellipse cx="168" cy="62" rx="44" ry="16"/>
    <ellipse cx="452" cy="108" rx="70" ry="22"/>
    <ellipse cx="500" cy="100" rx="46" ry="15"/>
  </g>

  <!-- ground -->
  <rect x="0" y="296" width="600" height="104" fill="url(#ground)"/>

  <!-- enemy plane (right, red) -->
  <g transform="translate(438,168)">
    <rect x="-46" y="-3" width="92" height="6" fill="#b3352f"/>
    <rect x="-13" y="-28" width="26" height="56" fill="#8f2622"/>
    <rect x="-58" y="-2" width="18" height="4" fill="#7a201d"/>
    <rect x="40" y="-2" width="18" height="4" fill="#7a201d"/>
    <rect x="-3" y="-2" width="26" height="4" fill="#e8d7b0"/>
  </g>

  <!-- bullets -->
  <g fill="#ffe680">
    <rect x="286" y="196" width="18" height="4"/>
    <rect x="256" y="196" width="18" height="4"/>
    <rect x="226" y="196" width="18" height="4"/>
  </g>

  <!-- player plane (left, olive/tan WW1 look) -->
  <g transform="translate(150,200)">
    <rect x="-46" y="-3" width="92" height="6" fill="#6b6a3f"/>
    <rect x="-13" y="-28" width="26" height="56" fill="#4e4d2c"/>
    <rect x="-58" y="-2" width="18" height="4" fill="#3d3c21"/>
    <rect x="40" y="-2" width="18" height="4" fill="#3d3c21"/>
    <rect x="-3" y="-2" width="26" height="4" fill="#d9c79a"/>
    <!-- propeller -->
    <rect x="-58" y="-16" width="5" height="32" fill="#2e2d1a" opacity="0.8"/>
  </g>

  <!-- HUD score strip -->
  <g>
    <rect x="0" y="0" width="600" height="26" fill="#000000" opacity="0.35"/>
    <text x="12" y="19" font-family="ui-monospace, monospace" font-size="15" fill="#e8f2ff">1UP  02400</text>
    <text x="500" y="19" font-family="ui-monospace, monospace" font-size="15" fill="#e8f2ff" text-anchor="end">HI 11250</text>
  </g>

  <text x="300" y="376" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="3" fill="#ffffff" stroke="#1d2b38" stroke-width="5" paint-order="stroke">SOPWITH</text>
</svg>