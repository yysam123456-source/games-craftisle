<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Duke Nukem 3D - classic Build engine FPS">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120d24"/>
      <stop offset="0.55" stop-color="#2b1740"/>
      <stop offset="0.85" stop-color="#7a3326"/>
      <stop offset="1" stop-color="#c25a2a"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a38"/>
      <stop offset="1" stop-color="#160f26"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffe9c4" opacity="0.8">
    <circle cx="52" cy="38" r="1.4"/>
    <circle cx="140" cy="66" r="1.1"/>
    <circle cx="228" cy="30" r="1.3"/>
    <circle cx="330" cy="58" r="1"/>
    <circle cx="430" cy="34" r="1.4"/>
    <circle cx="520" cy="70" r="1.1"/>
    <circle cx="566" cy="40" r="1.2"/>
  </g>

  <!-- burning horizon glow -->
  <ellipse cx="300" cy="292" rx="330" ry="42" fill="#e8872a" opacity="0.28"/>

  <!-- ruined L.A. skyline -->
  <g fill="url(#far)">
    <rect x="0" y="238" width="58" height="62"/>
    <rect x="58" y="220" width="44" height="80"/>
    <rect x="102" y="248" width="38" height="52"/>
    <rect x="140" y="232" width="52" height="68"/>
    <path d="M192 248 L214 214 L236 248 Z"/>
    <rect x="236" y="240" width="46" height="60"/>
    <rect x="282" y="226" width="40" height="74"/>
    <rect x="322" y="252" width="52" height="48"/>
    <rect x="374" y="236" width="44" height="64"/>
    <rect x="418" y="216" width="50" height="84"/>
    <path d="M468 246 L490 208 L512 246 Z"/>
    <rect x="512" y="242" width="42" height="58"/>
    <rect x="554" y="228" width="46" height="72"/>
  </g>
  <!-- broken rebar + lit windows -->
  <g stroke="#0c0817" stroke-width="3">
    <path d="M214 214 L206 196 M214 214 L224 198"/>
    <path d="M490 208 L482 190 M490 208 L500 192"/>
  </g>
  <g fill="#d8a12a" opacity="0.85">
    <rect x="12" y="252" width="6" height="8"/>
    <rect x="30" y="268" width="6" height="8"/>
    <rect x="70" y="236" width="6" height="8"/>
    <rect x="90" y="258" width="6" height="8"/>
    <rect x="152" y="248" width="6" height="8"/>
    <rect x="248" y="256" width="6" height="8"/>
    <rect x="296" y="242" width="6" height="8"/>
    <rect x="340" y="266" width="6" height="8"/>
    <rect x="388" y="252" width="6" height="8"/>
    <rect x="434" y="232" width="6" height="8"/>
    <rect x="524" y="258" width="6" height="8"/>
    <rect x="572" y="244" width="6" height="8"/>
  </g>

  <!-- Duke (center-left): blonde hair, sunglasses, tank top -->
  <g transform="translate(196,236)">
    <!-- shoulders / red tank top -->
    <path d="M-72 96 Q-64 44 0 40 Q64 44 72 96 L72 108 L-72 108 Z" fill="#b03a2e"/>
    <path d="M-26 44 Q0 62 26 44 L26 108 L-26 108 Z" fill="#8f2a20"/>
    <!-- neck -->
    <rect x="-14" y="18" width="28" height="28" fill="#c68a54"/>
    <!-- head -->
    <ellipse cx="0" cy="-6" rx="42" ry="46" fill="#d9a06b"/>
    <!-- ears -->
    <ellipse cx="-42" cy="-2" rx="7" ry="11" fill="#c68a54"/>
    <ellipse cx="42" cy="-2" rx="7" ry="11" fill="#c68a54"/>
    <!-- spiky blonde hair -->
    <path d="M-44 -24 Q-52 -66 -30 -78 Q-38 -92 -18 -86 Q-20 -104 0 -94 Q20 -104 18 -86 Q38 -92 30 -78 Q52 -66 44 -24 Q34 -52 22 -40 Q28 -62 0 -56 Q-28 -62 -22 -40 Q-34 -52 -44 -24 Z" fill="#e8c86a"/>
    <!-- sunglasses -->
    <rect x="-40" y="-16" width="80" height="16" rx="4" fill="#101014"/>
    <rect x="-38" y="-14" width="30" height="10" rx="3" fill="#1c2430"/>
    <rect x="8" y="-14" width="30" height="10" rx="3" fill="#1c2430"/>
    <path d="M-30 -12 L-20 -14" stroke="#9ad0e8" stroke-width="2.5" opacity="0.9"/>
    <path d="M14 -14 L26 -12" stroke="#9ad0e8" stroke-width="2.5" opacity="0.9"/>
    <!-- grimace / shout -->
    <path d="M-20 14 Q0 8 20 14 Q16 34 0 34 Q-16 34 -20 14 Z" fill="#5c2318"/>
    <path d="M-18 16 L18 16 L16 22 L-16 22 Z" fill="#f0ead8"/>
    <!-- chin shadow -->
    <path d="M-30 22 Q0 44 30 22" fill="none" stroke="#b37a48" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- pig cop (right): green snout, police cap, blaster -->
  <g transform="translate(452,244)">
    <!-- gun arm -->
    <rect x="-88" y="34" width="58" height="12" rx="4" fill="#5a7a33"/>
    <rect x="-104" y="30" width="20" height="20" rx="3" fill="#2c2c34"/>
    <rect x="-100" y="24" width="10" height="8" fill="#3c3c46"/>
    <!-- body -->
    <path d="M-46 108 Q-40 52 0 48 Q40 52 46 108 Z" fill="#4a6b28"/>
    <!-- head -->
    <ellipse cx="0" cy="0" rx="38" ry="34" fill="#6f9a3f"/>
    <!-- snout -->
    <ellipse cx="0" cy="10" rx="20" ry="14" fill="#7faa4a"/>
    <ellipse cx="-8" cy="10" rx="3.4" ry="5" fill="#2c3418"/>
    <ellipse cx="8" cy="10" rx="3.4" ry="5" fill="#2c3418"/>
    <!-- red eyes -->
    <circle cx="-14" cy="-12" r="5.5" fill="#f0ead8"/>
    <circle cx="14" cy="-12" r="5.5" fill="#f0ead8"/>
    <circle cx="-14" cy="-12" r="2.6" fill="#c0392b"/>
    <circle cx="14" cy="-12" r="2.6" fill="#c0392b"/>
    <!-- police cap -->
    <path d="M-40 -22 Q0 -52 40 -22 Z" fill="#2c3e6b"/>
    <rect x="-42" y="-24" width="84" height="8" rx="3" fill="#1f2d52"/>
    <circle cx="0" cy="-34" r="5" fill="#d8a12a"/>
  </g>

  <!-- bullet tracers -->
  <g fill="#ffe680">
    <rect x="248" y="252" width="26" height="4" rx="2"/>
    <rect x="292" y="246" width="18" height="4" rx="2" opacity="0.75"/>
    <rect x="322" y="258" width="12" height="4" rx="2" opacity="0.5"/>
  </g>

  <!-- radiation trefoil (top-left) -->
  <g transform="translate(58,84)">
    <circle r="30" fill="#201c14" stroke="#d8a12a" stroke-width="3"/>
    <path d="M0 0 L-11.8 0 A12.2 12.2 0 0 1 -9.9 -10.57 L-3.9 -3.64 A4.2 4.2 0 0 0 0 0 Z" fill="#e8872a" transform="translate(0,0)"/>
    <path d="M0 0 L0 -11.8 A12.2 12.2 0 0 1 10.57 -9.9 L3.64 -3.9 A4.2 4.2 0 0 0 0 0 Z" fill="#e8872a"/>
    <path d="M0 0 L11.8 0 A12.2 12.2 0 0 1 9.9 10.57 L3.9 3.64 A4.2 4.2 0 0 0 0 0 Z" fill="#e8872a"/>
    <path d="M0 0 L0 11.8 A12.2 12.2 0 0 1 -10.57 9.9 L-3.64 3.9 A4.2 4.2 0 0 0 0 0 Z" fill="#e8872a"/>
    <circle r="4.4" fill="#d8a12a"/>
  </g>

  <!-- HUD strip -->
  <g>
    <rect x="0" y="0" width="600" height="26" fill="#000000" opacity="0.4"/>
    <text x="12" y="19" font-family="ui-monospace, monospace" font-size="15" fill="#e8f2ff">HEALTH 100%</text>
    <text x="300" y="19" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#e8c86a">ARMOR 0</text>
    <text x="588" y="19" text-anchor="end" font-family="ui-monospace, monospace" font-size="15" fill="#e8f2ff">AMMO 50</text>
  </g>

  <text x="300" y="374" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="3" fill="#ffffff" stroke="#1d1226" stroke-width="5" paint-order="stroke">DUKE NUKEM 3D</text>
</svg>
