<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="wipEout - futuristic anti-gravity racing">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050818"/>
      <stop offset="0.6" stop-color="#0d1030"/>
      <stop offset="1" stop-color="#241243"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171b3a"/>
      <stop offset="1" stop-color="#0a0c20"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.4" stop-color="#ffc603"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#cfe6ff">
    <circle cx="48" cy="42" r="1.4" opacity="0.9"/>
    <circle cx="120" cy="88" r="1" opacity="0.6"/>
    <circle cx="188" cy="36" r="1.2" opacity="0.8"/>
    <circle cx="262" cy="70" r="1" opacity="0.5"/>
    <circle cx="330" cy="30" r="1.5" opacity="0.9"/>
    <circle cx="402" cy="62" r="1" opacity="0.6"/>
    <circle cx="470" cy="40" r="1.3" opacity="0.8"/>
    <circle cx="540" cy="84" r="1" opacity="0.5"/>
    <circle cx="574" cy="34" r="1.2" opacity="0.7"/>
    <circle cx="86" cy="128" r="1" opacity="0.4"/>
    <circle cx="512" cy="130" r="1.1" opacity="0.5"/>
  </g>

  <!-- neon horizon glow -->
  <rect x="0" y="176" width="600" height="3" fill="#38f5ff" opacity="0.35"/>
  <rect x="0" y="182" width="600" height="1.5" fill="#ff3ec8" opacity="0.25"/>

  <!-- perspective track -->
  <path d="M 235 190 L 365 190 L 560 400 L 40 400 Z" fill="url(#track)"/>
  <!-- track neon edges -->
  <path d="M 235 190 L 40 400" stroke="#38f5ff" stroke-width="3" fill="none" opacity="0.9"/>
  <path d="M 365 190 L 560 400" stroke="#ff3ec8" stroke-width="3" fill="none" opacity="0.9"/>
  <!-- lane markings -->
  <g stroke="#ffc603" stroke-width="2" opacity="0.85">
    <line x1="300" y1="190" x2="300" y2="400"/>
    <line x1="262" y1="212" x2="176" y2="400"/>
    <line x1="338" y1="212" x2="424" y2="400"/>
  </g>
  <g fill="#e8f6ff" opacity="0.5">
    <rect x="296" y="230" width="8" height="26"/>
    <rect x="292" y="290" width="16" height="40"/>
    <rect x="286" y="362" width="28" height="38"/>
  </g>

  <!-- speed streaks -->
  <g stroke="#9fd8ff" stroke-width="2" opacity="0.35">
    <line x1="60" y1="230" x2="150" y2="230"/>
    <line x1="30" y1="270" x2="110" y2="270"/>
    <line x1="470" y1="240" x2="560" y2="240"/>
    <line x1="500" y1="286" x2="580" y2="286"/>
  </g>

  <!-- player ship (rear view, anti-gravity racer) -->
  <g transform="translate(300,318)">
    <!-- engine glow -->
    <path d="M -34 34 L -20 6 L 20 6 L 34 34 Z" fill="url(#engine)" opacity="0.9"/>
    <!-- wings -->
    <path d="M -86 26 L -30 2 L -30 14 L -78 38 Z" fill="#20264e"/>
    <path d="M 86 26 L 30 2 L 30 14 L 78 38 Z" fill="#20264e"/>
    <path d="M -86 26 L -30 2 L -30 6 L -82 30 Z" fill="#38f5ff" opacity="0.7"/>
    <path d="M 86 26 L 30 2 L 30 6 L 82 30 Z" fill="#ff3ec8" opacity="0.7"/>
    <!-- hull -->
    <path d="M 0 -34 L 26 6 L 34 30 L -34 30 L -26 6 Z" fill="#ffc603"/>
    <path d="M 0 -34 L 26 6 L 12 6 L 0 -20 Z" fill="#ffe97a"/>
    <!-- cockpit -->
    <path d="M 0 -26 L 12 0 L -12 0 Z" fill="#0a0c20"/>
    <path d="M 0 -22 L 8 -2 L -8 -2 Z" fill="#38f5ff" opacity="0.8"/>
  </g>

  <!-- HUD strip -->
  <g>
    <rect x="0" y="0" width="600" height="26" fill="#000000" opacity="0.4"/>
    <text x="12" y="19" font-family="ui-monospace, monospace" font-size="15" fill="#ffc603">SPEED 0480</text>
    <text x="300" y="19" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#e8f6ff">LAP 1/3</text>
    <text x="588" y="19" text-anchor="end" font-family="ui-monospace, monospace" font-size="15" fill="#38f5ff">AG SHIP</text>
  </g>

  <text x="300" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="3" fill="#ffc603" stroke="#101228" stroke-width="5" paint-order="stroke">WIPEOUT</text>
</svg>
