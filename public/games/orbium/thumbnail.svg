<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Orbium thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122a3f"/>
      <stop offset="1" stop-color="#050b12"/>
    </linearGradient>
    <radialGradient id="marble" cx="35%" cy="30%" r="65%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#bcd7e8"/>
      <stop offset="1" stop-color="#4a6b80"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- isometric tile grid -->
  <g fill="none" stroke="#4a7f9e" stroke-width="1.2" opacity="0.55">
    <path d="M200 70 L262 106 L200 142 L138 106 Z"/>
    <path d="M200 100 L262 136 L200 172 L138 136 Z" opacity="0.7"/>
    <path d="M200 130 L262 166 L200 202 L138 166 Z" opacity="0.5"/>
    <path d="M138 106 L200 142 L200 202 L138 166 Z"/>
    <path d="M262 106 L200 142 L200 202 L262 166 Z"/>
    <path d="M138 166 L200 202 L200 232 L138 196 Z" opacity="0.6"/>
    <path d="M262 166 L200 202 L200 232 L262 196 Z" opacity="0.6"/>
  </g>

  <!-- rotator bars -->
  <g stroke="#6fd3ff" stroke-width="5" stroke-linecap="round" opacity="0.9" filter="url(#glow)">
    <path d="M152 112 L182 129"/>
    <path d="M248 112 L218 129"/>
  </g>
  <g stroke="#ffb347" stroke-width="5" stroke-linecap="round" opacity="0.85" filter="url(#glow)">
    <path d="M200 208 L200 176"/>
  </g>

  <!-- the orb -->
  <circle cx="200" cy="106" r="13" fill="url(#marble)"/>
  <circle cx="195" cy="101" r="4" fill="#ffffff" opacity="0.75"/>

  <!-- dock / goal markers -->
  <g fill="none" stroke="#7ef0c8" stroke-width="2" opacity="0.8">
    <rect x="118" y="186" width="16" height="16" transform="skewY(26)"/>
    <rect x="266" y="186" width="16" height="16" transform="skewY(-26)"/>
  </g>

  <text x="200" y="278" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="22" font-weight="bold" fill="#dcecf7" letter-spacing="7">ORBIUM</text>
</svg>