<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Quake - classic dark-fantasy first-person shooter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0a08"/>
      <stop offset="0.55" stop-color="#241a12"/>
      <stop offset="1" stop-color="#3a2a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.42">
      <stop offset="0" stop-color="#d8b26a" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#a8763a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a8763a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4126"/>
      <stop offset="1" stop-color="#33240f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- stone wall courses -->
  <g fill="#4a3826">
    <rect x="0" y="182" width="600" height="24"/>
    <rect x="0" y="230" width="600" height="24"/>
    <rect x="0" y="278" width="600" height="24"/>
  </g>
  <g fill="#3a2c1b">
    <rect x="0" y="206" width="600" height="24"/>
    <rect x="0" y="254" width="600" height="24"/>
    <rect x="0" y="302" width="600" height="24"/>
  </g>
  <g fill="#241b10" opacity="0.85">
    <rect x="0" y="180" width="600" height="3"/>
    <rect x="0" y="228" width="600" height="3"/>
    <rect x="0" y="276" width="600" height="3"/>
    <rect x="0" y="324" width="600" height="3"/>
  </g>
  <!-- staggered block joints -->
  <g fill="#1c1409" opacity="0.7">
    <rect x="70" y="182" width="3" height="24"/>
    <rect x="220" y="182" width="3" height="24"/>
    <rect x="370" y="182" width="3" height="24"/>
    <rect x="520" y="182" width="3" height="24"/>
    <rect x="30" y="206" width="3" height="24"/>
    <rect x="145" y="206" width="3" height="24"/>
    <rect x="300" y="206" width="3" height="24"/>
    <rect x="455" y="206" width="3" height="24"/>
    <rect x="70" y="230" width="3" height="24"/>
    <rect x="220" y="230" width="3" height="24"/>
    <rect x="370" y="230" width="3" height="24"/>
    <rect x="520" y="230" width="3" height="24"/>
    <rect x="30" y="254" width="3" height="24"/>
    <rect x="145" y="254" width="3" height="24"/>
    <rect x="300" y="254" width="3" height="24"/>
    <rect x="455" y="254" width="3" height="24"/>
    <rect x="70" y="278" width="3" height="24"/>
    <rect x="220" y="278" width="3" height="24"/>
    <rect x="370" y="278" width="3" height="24"/>
    <rect x="520" y="278" width="3" height="24"/>
    <rect x="30" y="302" width="3" height="24"/>
    <rect x="145" y="302" width="3" height="24"/>
    <rect x="300" y="302" width="3" height="24"/>
    <rect x="455" y="302" width="3" height="24"/>
  </g>

  <!-- lava cracks glowing through the masonry -->
  <g stroke="#e0762a" stroke-width="2.5" opacity="0.75" fill="none">
    <path d="M 40 206 L 66 222 L 52 240 L 78 258"/>
    <path d="M 540 230 L 566 246 L 548 266 L 572 284"/>
    <path d="M 150 302 L 176 318 L 158 336"/>
  </g>

  <!-- archway into the dark -->
  <path d="M 235 330 L 235 210 Q 300 140 365 210 L 365 330 Z" fill="#0a0705"/>
  <path d="M 245 330 L 245 214 Q 300 152 355 214 L 355 330 Z" fill="#14100a"/>

  <!-- torch flames on the walls -->
  <g>
    <rect x="120" y="176" width="5" height="26" fill="#2a1d10"/>
    <ellipse cx="122.5" cy="168" rx="9" ry="16" fill="#e0762a"/>
    <ellipse cx="122.5" cy="170" rx="4" ry="9" fill="#ffd27a"/>
    <rect x="475" y="176" width="5" height="26" fill="#2a1d10"/>
    <ellipse cx="477.5" cy="168" rx="9" ry="16" fill="#e0762a"/>
    <ellipse cx="477.5" cy="170" rx="4" ry="9" fill="#ffd27a"/>
  </g>

  <!-- ambient glow behind the rune -->
  <rect width="600" height="400" fill="url(#glow)"/>

  <!-- floating rune motes -->
  <g fill="#d8b26a">
    <rect x="150" y="120" width="7" height="7" opacity="0.5"/>
    <rect x="452" y="96" width="5" height="5" opacity="0.4"/>
    <rect x="196" y="300" width="5" height="5" opacity="0.35"/>
    <rect x="420" y="330" width="6" height="6" opacity="0.3"/>
    <rect x="500" y="140" width="4" height="4" opacity="0.45"/>
  </g>

  <!-- Quake rune logo (runic Q), gold on dark -->
  <g>
    <polygon points="252,104 322,132 252,164" fill="#c9a35c"/>
    <polygon points="262,116 306,136 262,152" fill="#a8763a"/>
    <polygon points="286,120 316,120 316,286 286,286" fill="#c9a35c"/>
    <polygon points="316,214 372,240 350,258 316,254" fill="#c9a35c"/>
    <polygon points="318,222 356,240 340,250 318,246" fill="#a8763a"/>
    <polygon points="286,286 316,286 316,296 286,296" fill="#8a6128"/>
  </g>

  <!-- player weapon viewmodel (shotgun silhouette, first person) -->
  <g>
    <polygon points="196,400 232,352 250,330 350,330 368,352 404,400" fill="#0a0806"/>
    <rect x="262" y="330" width="30" height="70" fill="#120d08"/>
    <rect x="308" y="330" width="30" height="70" fill="#120d08"/>
    <rect x="262" y="336" width="30" height="6" fill="#3a2c1a"/>
    <rect x="308" y="336" width="30" height="6" fill="#3a2c1a"/>
    <rect x="280" y="382" width="40" height="18" fill="#241a10"/>
  </g>

  <!-- HUD status strip -->
  <g>
    <rect x="0" y="344" width="600" height="40" fill="url(#hud)"/>
    <rect x="0" y="344" width="600" height="2" fill="#6b5132"/>
    <!-- segment icons -->
    <rect x="18" y="352" width="26" height="24" fill="#8a6128"/>
    <rect x="52" y="352" width="26" height="24" fill="#8a6128"/>
    <rect x="86" y="352" width="26" height="24" fill="#6b4f2a"/>
    <rect x="120" y="352" width="26" height="24" fill="#6b4f2a"/>
    <text x="170" y="374" font-family="ui-monospace, monospace" font-size="26" font-weight="700" fill="#e8d5ae">100</text>
    <text x="252" y="374" font-family="ui-monospace, monospace" font-size="26" font-weight="700" fill="#c9563e">25</text>
    <!-- ammo pips -->
    <g fill="#d8b26a">
      <rect x="360" y="352" width="8" height="24"/>
      <rect x="374" y="352" width="8" height="24"/>
      <rect x="388" y="352" width="8" height="24"/>
      <rect x="402" y="352" width="8" height="24"/>
      <rect x="416" y="352" width="8" height="24" opacity="0.35"/>
      <rect x="430" y="352" width="8" height="24" opacity="0.35"/>
      <rect x="444" y="352" width="8" height="24" opacity="0.35"/>
    </g>
  </g>

  <text x="300" y="392" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="3" fill="#e8d5ae" stroke="#1d1409" stroke-width="5" paint-order="stroke">QUAKE</text>
</svg>
