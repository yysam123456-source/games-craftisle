<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="One Button Games thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset="1" stop-color="#07040f"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- orbit rings -->
  <circle cx="200" cy="142" r="34" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.35"/>
  <circle cx="200" cy="142" r="56" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.25"/>
  <circle cx="200" cy="142" r="80" fill="none" stroke="#f472b6" stroke-width="1.5" opacity="0.18"/>

  <!-- core -->
  <circle cx="200" cy="142" r="46" fill="url(#core)"/>
  <circle cx="200" cy="142" r="16" fill="#ffffff"/>

  <!-- orbiting cubes (the one-button mechanic: tap to act) -->
  <g fill="#c4b5fd">
    <rect x="230" y="136" width="12" height="12"/>
    <rect x="158" y="104" width="9" height="9"/>
    <rect x="166" y="176" width="11" height="11"/>
  </g>
  <g fill="#7dd3fc">
    <rect x="196" y="58" width="8" height="8"/>
    <rect x="256" y="156" width="7" height="7"/>
  </g>

  <!-- press ripple -->
  <circle cx="200" cy="142" r="94" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.18"/>

  <!-- the button -->
  <g>
    <rect x="160" y="238" width="80" height="30" rx="15" fill="#7c3aed"/>
    <rect x="166" y="243" width="68" height="20" rx="10" fill="#a78bfa"/>
    <text x="200" y="257" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
          font-size="12" font-weight="bold" fill="#1e1035" letter-spacing="3">TAP</text>
  </g>

  <text x="200" y="52" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="19" font-weight="bold" fill="#e9d5ff" letter-spacing="3">ONE BUTTON GAMES</text>
</svg>