<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Doom - classic sci-horror FPS">
  <defs>
    <linearGradient id="hell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a08"/>
      <stop offset="0.55" stop-color="#571210"/>
      <stop offset="1" stop-color="#160404"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#a3120c" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- hellish background -->
  <rect width="600" height="400" fill="url(#hell)"/>
  <rect width="600" height="400" fill="url(#glow)"/>

  <!-- distant lava cracks / horizon -->
  <g stroke="#ff5a1e" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <path d="M0 316 L90 300 L150 312 L240 292 L330 310 L430 296 L520 314 L600 298" fill="none"/>
  </g>
  <rect x="0" y="330" width="600" height="70" fill="#0d0202"/>
  <g fill="#ff6a22" fill-opacity="0.35">
    <ellipse cx="120" cy="356" rx="60" ry="7"/>
    <ellipse cx="470" cy="368" rx="80" ry="8"/>
  </g>

  <!-- cacodemon (floating red demon) -->
  <g transform="translate(300,168)">
    <ellipse cx="0" cy="10" rx="96" ry="92" fill="#8f1410"/>
    <ellipse cx="0" cy="0" rx="92" ry="88" fill="#c22018"/>
    <ellipse cx="-26" cy="-30" rx="30" ry="20" fill="#e85a30" opacity="0.5"/>
    <!-- single eye -->
    <ellipse cx="0" cy="-6" rx="34" ry="30" fill="#f3e3d8"/>
    <ellipse cx="2" cy="-4" rx="14" ry="16" fill="#0d0202"/>
    <ellipse cx="-3" cy="-10" rx="4" ry="5" fill="#ffffff" opacity="0.9"/>
    <!-- mouth with fangs -->
    <path d="M-58 44 Q0 84 58 44 Q0 62 -58 44 Z" fill="#2a0503"/>
    <g fill="#f3e3d8">
      <path d="M-40 48 l7 20 7 -20 Z"/>
      <path d="M-12 54 l7 22 7 -22 Z"/>
      <path d="M16 48 l7 20 7 -20 Z"/>
      <path d="M40 44 l6 17 6 -17 Z"/>
    </g>
    <!-- spikes -->
    <g fill="#8f1410">
      <path d="M-92 -20 l-22 -14 8 26 Z"/>
      <path d="M92 -20 l22 -14 -8 26 Z"/>
      <path d="M-60 -86 l-10 -26 20 20 Z"/>
      <path d="M60 -86 l10 -26 -20 20 Z"/>
    </g>
  </g>

  <!-- fireballs -->
  <g>
    <circle cx="128" cy="120" r="12" fill="#ffb347"/>
    <circle cx="128" cy="120" r="7" fill="#fff3c4"/>
    <circle cx="96" cy="152" r="8" fill="#ff8c2e"/>
    <circle cx="96" cy="152" r="4" fill="#ffe9a8"/>
  </g>

  <!-- shotgun barrel hint (bottom right) -->
  <g transform="rotate(-14 470 330)">
    <rect x="380" y="318" width="180" height="22" rx="6" fill="#3a3f45"/>
    <rect x="380" y="318" width="180" height="8" rx="4" fill="#565d66"/>
    <rect x="536" y="314" width="26" height="30" rx="4" fill="#2c3036"/>
  </g>

  <!-- crosshair -->
  <g stroke="#e8f2ff" stroke-width="2" opacity="0.85">
    <path d="M300 96 v14 M300 118 v-0" />
    <path d="M292 105 h14" transform="translate(0,0)"/>
  </g>
  <circle cx="300" cy="105" r="3" fill="#e8f2ff" opacity="0.9"/>

  <!-- classic status bar HUD -->
  <g>
    <rect x="0" y="368" width="600" height="32" fill="#1c1a1a"/>
    <rect x="0" y="368" width="600" height="2" fill="#3d3939"/>
    <text x="14" y="390" font-family="ui-monospace, monospace" font-size="15" fill="#c8402c">AMMO</text>
    <text x="66" y="390" font-family="ui-monospace, monospace" font-size="15" fill="#e8dfc8">50</text>
    <text x="140" y="390" font-family="ui-monospace, monospace" font-size="15" fill="#c8402c">HEALTH</text>
    <text x="212" y="390" font-family="ui-monospace, monospace" font-size="15" fill="#e8dfc8">100%</text>
    <text x="300" y="390" font-family="ui-monospace, monospace" font-size="15" fill="#c8a02c">ARMOR</text>
    <text x="360" y="390" font-family="ui-monospace, monospace" font-size="15" fill="#e8dfc8">0%</text>
    <g transform="translate(560,384)" fill="#e8dfc8">
      <rect x="-26" y="-10" width="14" height="20" rx="2"/>
      <rect x="-8" y="-10" width="14" height="20" rx="2"/>
      <rect x="10" y="-10" width="14" height="20" rx="2"/>
    </g>
  </g>

  <text x="300" y="34" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="6" fill="#e8a08c" opacity="0.85">E1M1 · HANGAR</text>
</svg>
