<!DOCTYPE html>
<html>
  <head>
    <title>Trigger Rally</title>
    <meta name="description" content="Fast arcade rally racing action! Play in your browser with WebGL 3D graphics.">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Ubuntu:400,400italic,700italic" type="text/css">
    <link rel="stylesheet" href="css/unified.css">
    <!--<link rel="icon" href="favicon.png">-->
    
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-2FMSDYCK1E');
    </script>
  </head>
  <body>
    <div id="unified-container"></div><img src="images/icon-128.png" style="display:none" title="Trigger Rally icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.2.0/socket.io.dev.js"></script>
    <script>
      // This value becomes the Backbone router's base URL. location.pathname
      // includes the page filename (".../index.html"), which then prefixes every
      // route the app requests and 404s. Drop the filename so the base is the
      // game directory.
      window.__INITIAL_PATH__ =
        sessionStorage.redirect ||
        (location.pathname.replace(/[^/]*$/, '') + location.search + location.hash);
      delete sessionStorage.redirect;
    </script>
    <script data-main="scripts/main" src="js/require.js"></script>
  </body>
</html>
