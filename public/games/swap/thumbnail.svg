<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Swap thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123243"/>
      <stop offset="1" stop-color="#06121a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- tile grid -->
  <g stroke="#1d4a63" stroke-width="1.5">
    <g fill="#0d2536">
      <rect x="80" y="70" width="60" height="60" rx="6"/>
      <rect x="140" y="70" width="60" height="60" rx="6"/>
      <rect x="200" y="70" width="60" height="60" rx="6"/>
      <rect x="80" y="130" width="60" height="60" rx="6"/>
      <rect x="140" y="130" width="60" height="60" rx="6"/>
      <rect x="200" y="130" width="60" height="60" rx="6"/>
      <rect x="80" y="190" width="60" height="60" rx="6"/>
      <rect x="140" y="190" width="60" height="60" rx="6"/>
      <rect x="200" y="190" width="60" height="60" rx="6"/>
    </g>
  </g>

  <!-- swap arrows -->
  <g fill="#ffd166" filter="url(#glow)">
    <path d="M110 100 h44 v-14 l22 20 l-22 20 v-14 h-44 z" opacity="0.95"/>
    <path d="M210 160 h-44 v-14 l-22 20 l22 20 v-14 h44 z" opacity="0.95"/>
  </g>

  <!-- the player -->
  <g transform="translate(170,160)">
    <circle cx="0" cy="0" r="13" fill="#4ecdc4"/>
    <circle cx="-4" cy="-4" r="4" fill="#ffffff" opacity="0.7"/>
    <rect x="-9" y="11" width="18" height="5" rx="2.5" fill="#2a9d8f"/>
  </g>

  <!-- goal marker -->
  <g transform="translate(320,220)">
    <rect x="-16" y="-16" width="32" height="32" rx="6" fill="none"
          stroke="#7ef0c8" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="5" fill="#7ef0c8" filter="url(#glow)"/>
  </g>

  <!-- HUD hint -->
  <g opacity="0.75">
    <rect x="288" y="86" width="76" height="8" rx="4" fill="#4ecdc4"/>
    <rect x="288" y="102" width="52" height="8" rx="4" fill="#ffd166"/>
    <rect x="288" y="118" width="64" height="8" rx="4" fill="#ef6f6c"/>
  </g>

  <text x="200" y="288" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="24" font-weight="bold" fill="#e6f7ff" letter-spacing="10">SWAP</text>
</svg>