<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Cube Composer thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#e8eaee"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- available transformations palette -->
  <g>
    <rect x="46" y="96" width="46" height="46" rx="5" fill="#4fc3f7" filter="url(#shadow)"/>
    <rect x="46" y="152" width="46" height="46" rx="5" fill="#66bb6a" filter="url(#shadow)"/>
    <rect x="46" y="208" width="46" height="20" rx="5" fill="#ffa726" opacity="0.5"/>
  </g>

  <!-- the composer pipeline: arrow into transform cards -->
  <g stroke="#b0b6c0" stroke-width="2" fill="none">
    <path d="M96 119 H126"/>
    <path d="M96 175 H126"/>
  </g>
  <polygon points="126,113 140,119 126,125" fill="#b0b6c0"/>

  <!-- program stack (the "code" being composed) -->
  <g filter="url(#shadow)">
    <rect x="140" y="88" width="120" height="30" rx="5" fill="#f6c945"/>
    <rect x="140" y="124" width="120" height="30" rx="5" fill="#4fc3f7"/>
    <rect x="140" y="160" width="120" height="30" rx="5" fill="#66bb6a"/>
  </g>
  <!-- transform labels -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold"
     fill="#3a3f47" text-anchor="middle">
    <text x="200" y="107">map ○↦●</text>
    <text x="200" y="143">filter ■</text>
    <text x="200" y="179">rotate ▲</text>
  </g>

  <path d="M264 153 H292" stroke="#b0b6c0" stroke-width="2"/>
  <polygon points="292,147 306,153 292,159" fill="#b0b6c0"/>

  <!-- the target canvas -->
  <g filter="url(#shadow)">
    <rect x="310" y="86" width="52" height="52" rx="5" fill="#4fc3f7"/>
    <rect x="310" y="144" width="52" height="52" rx="5" fill="#ffffff" stroke="#d0d4da"/>
  </g>

  <!-- solved checkmark -->
  <g transform="translate(336,170)">
    <circle r="15" fill="#66bb6a"/>
    <path d="M-7 0 l5 5 l9 -10" stroke="#ffffff" stroke-width="3.5" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="200" y="42" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="21" font-weight="bold" fill="#2b2f36" letter-spacing="2">cube composer</text>
  <text x="200" y="286" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="12" fill="#7a808a" letter-spacing="3">A PUZZLE GAME INSPIRED BY FUNCTIONAL PROGRAMMING</text>
</svg>