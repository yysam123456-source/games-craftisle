<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Tower Defense thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a2f"/>
      <stop offset="1" stop-color="#08110d"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a86a"/>
      <stop offset="1" stop-color="#8a6f42"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- winding enemy path (isometric tiles) -->
  <g stroke="#6b5533" stroke-width="1">
    <polygon points="30,214 66,228 66,256 30,242" fill="url(#path)"/>
    <polygon points="66,228 102,214 102,242 66,256" fill="url(#path)"/>
    <polygon points="102,214 138,200 138,228 102,242" fill="url(#path)"/>
    <polygon points="138,200 174,186 174,214 138,228" fill="url(#path)"/>
    <polygon points="174,186 210,172 210,200 174,214" fill="url(#path)"/>
    <polygon points="210,172 246,158 246,186 210,200" fill="url(#path)"/>
    <polygon points="246,158 282,144 282,172 246,186" fill="url(#path)"/>
    <polygon points="282,144 318,130 318,158 282,172" fill="url(#path)"/>
    <polygon points="318,130 354,116 354,144 318,158" fill="url(#path)"/>
    <polygon points="138,228 174,214 174,242 138,256" fill="url(#path)"/>
    <polygon points="174,214 210,200 210,228 174,242" fill="url(#path)"/>
    <polygon points="210,200 246,186 246,214 210,228" fill="url(#path)"/>
    <polygon points="246,186 282,172 282,200 246,214" fill="url(#path)"/>
    <polygon points="282,172 318,158 318,186 282,200" fill="url(#path)"/>
  </g>

  <!-- grass patches -->
  <g fill="#2f7a4f" opacity="0.85">
    <polygon points="60,150 100,136 100,164 60,178"/>
    <polygon points="230,236 270,222 270,250 230,264"/>
    <polygon points="316,196 356,182 356,210 316,224"/>
  </g>

  <!-- towers -->
  <g>
    <g transform="translate(96,120)">
      <ellipse cx="0" cy="16" rx="20" ry="9" fill="#000" opacity="0.35"/>
      <rect x="-15" y="-14" width="30" height="30" fill="#4a5568"/>
      <polygon points="-18,-14 0,-24 18,-14 0,-4" fill="#5a6678"/>
      <rect x="-3" y="-34" width="6" height="14" fill="#2d3748"/>
      <circle cx="0" cy="-34" r="4" fill="#ef4444" filter="url(#glow)"/>
    </g>
    <g transform="translate(268,226)">
      <ellipse cx="0" cy="16" rx="20" ry="9" fill="#000" opacity="0.35"/>
      <rect x="-15" y="-14" width="30" height="30" fill="#4a5568"/>
      <polygon points="-18,-14 0,-24 18,-14 0,-4" fill="#5a6678"/>
      <rect x="-3" y="-34" width="6" height="14" fill="#2d3748"/>
      <circle cx="0" cy="-34" r="4" fill="#f59e0b" filter="url(#glow)"/>
    </g>
  </g>

  <!-- enemies marching -->
  <g>
    <ellipse cx="118" cy="212" rx="9" ry="5" fill="#000" opacity="0.4"/>
    <circle cx="118" cy="204" r="7" fill="#7c3aed"/>
    <rect x="113" y="204" width="10" height="8" fill="#6d28d9"/>
    <circle cx="122" cy="184" r="7" fill="#7c3aed"/>
  </g>

  <!-- exit gate -->
  <g transform="translate(354,116)">
    <polygon points="0,-8 14,-14 14,4 0,10" fill="#22c55e" opacity="0.9" filter="url(#glow)"/>
    <polygon points="0,-8 14,-14 14,4 0,10" fill="none" stroke="#86efac" stroke-width="2"/>
  </g>

  <!-- projectile -->
  <circle cx="196" cy="188" r="3" fill="#fde047" filter="url(#glow)"/>

  <text x="200" y="288" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="19" font-weight="bold" fill="#d1fae5" letter-spacing="4">TOWER DEFENSE</text>
</svg>