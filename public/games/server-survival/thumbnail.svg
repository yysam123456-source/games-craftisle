<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Server Survival - 3D cloud architecture survival game at night">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.6" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101b30"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="ledGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- night sky -->
  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e5e7eb">
    <circle cx="48" cy="42" r="1.2" opacity="0.8"/>
    <circle cx="112" cy="88" r="0.9" opacity="0.5"/>
    <circle cx="176" cy="34" r="1.1" opacity="0.7"/>
    <circle cx="238" cy="70" r="0.8" opacity="0.4"/>
    <circle cx="300" cy="28" r="1" opacity="0.6"/>
    <circle cx="366" cy="62" r="1.2" opacity="0.75"/>
    <circle cx="430" cy="36" r="0.9" opacity="0.5"/>
    <circle cx="492" cy="80" r="1.1" opacity="0.65"/>
    <circle cx="548" cy="44" r="0.9" opacity="0.55"/>
    <circle cx="82" cy="130" r="0.8" opacity="0.35"/>
    <circle cx="520" cy="128" r="0.8" opacity="0.35"/>
  </g>
  <circle cx="516" cy="66" r="52" fill="url(#moonGlow)"/>
  <circle cx="516" cy="66" r="17" fill="#cbd5e1" opacity="0.9"/>
  <circle cx="510" cy="60" r="3" fill="#94a3b8" opacity="0.6"/>
  <circle cx="522" cy="72" r="2.2" fill="#94a3b8" opacity="0.5"/>

  <!-- isometric grid floor -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.75">
    <polygon points="300,150 360,180 300,210 240,180" fill="#0d1526"/>
    <polygon points="420,210 480,240 420,270 360,240" fill="#0d1526"/>
    <polygon points="180,210 240,240 180,270 120,240" fill="#0d1526"/>
    <polygon points="300,210 360,240 300,270 240,240" fill="#0d1526"/>
    <polygon points="420,270 480,300 420,330 360,300" fill="#0d1526"/>
    <polygon points="300,270 360,300 300,330 240,300" fill="#0d1526"/>
    <polygon points="180,270 240,300 180,330 120,300" fill="#0d1526"/>
    <polygon points="420,150 480,180 420,210 360,180" fill="#0d1526"/>
    <polygon points="180,150 240,180 180,210 120,180" fill="#0d1526"/>
  </g>
  <!-- highlighted tiles under nodes -->
  <g stroke="#00ff85" stroke-width="1.4" opacity="0.5">
    <polygon points="300,210 360,240 300,270 240,240" fill="#12291f"/>
    <polygon points="420,270 480,300 420,330 360,300" fill="#12291f"/>
  </g>

  <!-- link lines between nodes -->
  <g stroke="#38bdf8" stroke-width="1.6" opacity="0.7" stroke-dasharray="5 4">
    <line x1="252" y1="196" x2="322" y2="166"/>
    <line x1="322" y1="166" x2="392" y2="196"/>
  </g>

  <!-- firewall node (front door, left) with shield -->
  <g transform="translate(240,240)">
    <polygon points="0,0 14,-10 28,0 14,10" fill="#1f2937"/>
    <rect x="0" y="0" width="28" height="44" fill="#111827" stroke="#374151" stroke-width="1"/>
    <polygon points="28,0 42,-10 42,34 28,44" fill="#0b1220"/>
    <path d="M14 8 l10 4 v8 c0 7 -5 11 -10 13 c -5 -2 -10 -6 -10 -13 v -8 Z" fill="#f97316" opacity="0.9"/>
    <path d="M14 12 l6 2.5 v6 c0 4.5 -3 7 -6 8.5 c -3 -1.5 -6 -4 -6 -8.5 v -6 Z" fill="#fdba74"/>
  </g>

  <!-- compute rack cluster (center) -->
  <g transform="translate(300,210)">
    <polygon points="0,0 16,-11 32,0 16,11" fill="#1f2937"/>
    <rect x="0" y="0" width="32" height="58" fill="#111827" stroke="#374151" stroke-width="1"/>
    <polygon points="32,0 48,-11 48,47 32,58" fill="#0b1220"/>
    <g filter="url(#ledGlow)">
      <rect x="4" y="6" width="5" height="3" fill="#00ff85"/>
      <rect x="13" y="6" width="5" height="3" fill="#3b82f6"/>
      <rect x="22" y="6" width="5" height="3" fill="#f97316"/>
      <rect x="4" y="14" width="5" height="3" fill="#3b82f6"/>
      <rect x="13" y="14" width="5" height="3" fill="#00ff85"/>
      <rect x="4" y="22" width="5" height="3" fill="#f97316"/>
      <rect x="13" y="22" width="5" height="3" fill="#00ff85"/>
      <rect x="22" y="22" width="5" height="3" fill="#00ff85"/>
      <rect x="4" y="30" width="5" height="3" fill="#00ff85"/>
      <rect x="22" y="30" width="5" height="3" fill="#3b82f6"/>
    </g>
  </g>

  <!-- GPU cluster (right, tall, power-hungry) -->
  <g transform="translate(420,240)">
    <polygon points="0,0 16,-11 32,0 16,11" fill="#1f2937"/>
    <rect x="0" y="0" width="32" height="72" fill="#111827" stroke="#374151" stroke-width="1"/>
    <polygon points="32,0 48,-11 48,61 32,72" fill="#0b1220"/>
    <g filter="url(#ledGlow)">
      <rect x="4" y="6" width="20" height="3" fill="#a855f7"/>
      <rect x="4" y="14" width="5" height="3" fill="#a855f7"/>
      <rect x="13" y="14" width="5" height="3" fill="#a855f7"/>
      <rect x="4" y="22" width="20" height="3" fill="#a855f7" opacity="0.85"/>
      <rect x="4" y="30" width="5" height="3" fill="#e879f9"/>
      <rect x="13" y="30" width="5" height="3" fill="#a855f7"/>
      <rect x="4" y="38" width="20" height="3" fill="#a855f7" opacity="0.7"/>
      <rect x="4" y="46" width="5" height="3" fill="#e879f9"/>
      <rect x="13" y="46" width="5" height="3" fill="#a855f7"/>
      <rect x="22" y="46" width="5" height="3" fill="#a855f7"/>
    </g>
    <!-- power draw bolt -->
    <path d="M40 -22 l -8 12 h5 l -3 10 10 -14 h -5 Z" fill="#fde047"/>
  </g>

  <!-- traffic packets on the links -->
  <g filter="url(#ledGlow)">
    <circle cx="278" cy="185" r="2.6" fill="#00ff85"/>
    <circle cx="348" cy="178" r="2.6" fill="#3b82f6"/>
    <circle cx="372" cy="188" r="2.6" fill="#f97316"/>
    <!-- malicious packet bounced off the firewall -->
    <circle cx="222" cy="206" r="2.8" fill="#ef4444"/>
    <path d="M214 196 l 8 8 M222 196 l -8 8" stroke="#ef4444" stroke-width="1.6"/>
  </g>

  <!-- DDoS wave incoming from the left edge -->
  <g opacity="0.85">
    <circle cx="58" cy="228" r="3" fill="#ef4444"/>
    <circle cx="86" cy="244" r="2.4" fill="#ef4444" opacity="0.8"/>
    <circle cx="112" cy="234" r="2.8" fill="#ef4444" opacity="0.9"/>
    <circle cx="140" cy="250" r="2.2" fill="#ef4444" opacity="0.7"/>
    <circle cx="166" cy="240" r="2.6" fill="#ef4444" opacity="0.8"/>
  </g>

  <!-- HUD strip (top) echoing the in-game stats panel -->
  <g>
    <rect x="0" y="0" width="600" height="26" fill="#000000" opacity="0.4"/>
    <text x="12" y="18" font-family="ui-monospace, monospace" font-size="13" fill="#00ff85">$500</text>
    <text x="70" y="18" font-family="ui-monospace, monospace" font-size="13" fill="#facc15">REP 100%</text>
    <text x="160" y="18" font-family="ui-monospace, monospace" font-size="13" fill="#38bdf8">42.5 RPS</text>
    <text x="588" y="18" font-family="ui-monospace, monospace" font-size="13" fill="#e5e7eb" text-anchor="end">01:24</text>
  </g>

  <text x="300" y="378" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="4" fill="#ffffff" stroke="#050505" stroke-width="5" paint-order="stroke">SERVER SURVIVAL</text>
</svg>
