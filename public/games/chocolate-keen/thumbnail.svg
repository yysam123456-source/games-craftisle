<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Chocolate Keen - Commander Keen platformer on Mars">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140812"/>
      <stop offset="0.55" stop-color="#3a1522"/>
      <stop offset="1" stop-color="#7a3324"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8512e"/>
      <stop offset="1" stop-color="#54220f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="52" cy="42" r="1.5" opacity="0.9"/>
    <circle cx="128" cy="88" r="1.1" opacity="0.7"/>
    <circle cx="196" cy="34" r="1.6" opacity="0.9"/>
    <circle cx="262" cy="76" r="1.1" opacity="0.6"/>
    <circle cx="330" cy="30" r="1.4" opacity="0.8"/>
    <circle cx="392" cy="62" r="1.2" opacity="0.7"/>
    <circle cx="86" cy="128" r="1.2" opacity="0.6"/>
    <circle cx="452" cy="36" r="1.3" opacity="0.8"/>
    <circle cx="230" cy="130" r="1" opacity="0.5"/>
  </g>

  <!-- Mars in the sky -->
  <g>
    <circle cx="508" cy="84" r="30" fill="#c15a32"/>
    <ellipse cx="500" cy="74" rx="9" ry="6" fill="#a04a28" opacity="0.8"/>
    <ellipse cx="516" cy="94" rx="7" ry="5" fill="#a04a28" opacity="0.8"/>
    <ellipse cx="506" cy="100" rx="5" ry="3" fill="#8f3f22" opacity="0.8"/>
  </g>

  <!-- mars ground -->
  <rect x="0" y="296" width="600" height="104" fill="url(#ground)"/>
  <rect x="0" y="296" width="600" height="5" fill="#c96a3c" opacity="0.6"/>

  <!-- rocks -->
  <g fill="#6e2c16">
    <ellipse cx="70" cy="312" rx="26" ry="10"/>
    <ellipse cx="540" cy="322" rx="34" ry="12"/>
    <ellipse cx="330" cy="340" rx="20" ry="8"/>
  </g>
  <g fill="#84381f">
    <ellipse cx="66" cy="308" rx="18" ry="6" opacity="0.8"/>
    <ellipse cx="536" cy="318" rx="24" ry="7" opacity="0.8"/>
  </g>

  <!-- raygun blast -->
  <g fill="#ffd94a">
    <rect x="288" y="256" width="20" height="5"/>
    <rect x="308" y="257" width="10" height="3"/>
    <circle cx="322" cy="258" r="4" opacity="0.85"/>
    <circle cx="286" cy="258" r="3" opacity="0.6"/>
  </g>

  <!-- Yorp (red one-eyed Mars alien) -->
  <g transform="translate(430,268)">
    <ellipse cx="0" cy="24" rx="18" ry="4" fill="#3d1408" opacity="0.5"/>
    <rect x="-13" y="18" width="9" height="7" fill="#a8441f"/>
    <rect x="4" y="18" width="9" height="7" fill="#a8441f"/>
    <circle cx="0" cy="4" r="16" fill="#d8542e"/>
    <circle cx="0" cy="4" r="16" fill="none" stroke="#8f3316" stroke-width="2"/>
    <circle cx="2" cy="0" r="7" fill="#ffffff"/>
    <circle cx="3" cy="1" r="3" fill="#1a0d08"/>
    <path d="M -8 9 L 8 9 L 6 16 L 2 11 L -2 16 L -6 11 Z" fill="#f5ecd9"/>
  </g>

  <!-- Commander Keen: red helmet kid with raygun -->
  <g transform="translate(140,244)">
    <ellipse cx="4" cy="54" rx="20" ry="4" fill="#3d1408" opacity="0.5"/>
    <!-- legs + shoes -->
    <rect x="-9" y="34" width="8" height="16" fill="#3f6db5"/>
    <rect x="2" y="34" width="8" height="16" fill="#3f6db5"/>
    <rect x="-12" y="48" width="11" height="6" fill="#6b3a1f"/>
    <rect x="1" y="48" width="11" height="6" fill="#6b3a1f"/>
    <!-- body -->
    <rect x="-11" y="15" width="22" height="19" fill="#f0ede4"/>
    <rect x="-11" y="30" width="22" height="4" fill="#7a4a2a"/>
    <!-- arm + raygun -->
    <rect x="8" y="18" width="12" height="5" fill="#f0ede4"/>
    <rect x="18" y="16" width="16" height="6" fill="#9aa0a8"/>
    <rect x="32" y="17" width="5" height="4" fill="#ffd94a"/>
    <!-- head -->
    <rect x="-13" y="0" width="26" height="15" rx="3" fill="#d23c2e"/>
    <rect x="-9" y="7" width="18" height="9" fill="#f2c9a0"/>
    <rect x="-4" y="0" width="8" height="4" fill="#ffffff" opacity="0.85"/>
    <rect x="-6" y="9" width="2" height="3" fill="#1a1a1a"/>
    <rect x="2" y="9" width="2" height="3" fill="#1a1a1a"/>
    <rect x="-2" y="14" width="5" height="2" fill="#c98d5f"/>
  </g>

  <!-- HUD score strip -->
  <g>
    <rect x="0" y="0" width="600" height="26" fill="#000000" opacity="0.35"/>
    <text x="12" y="19" font-family="ui-monospace, monospace" font-size="15" fill="#e8f2ff">1UP  01250</text>
    <text x="500" y="19" font-family="ui-monospace, monospace" font-size="15" fill="#e8f2ff" text-anchor="end">HI 64300</text>
  </g>

  <text x="300" y="376" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="3" fill="#ffffff" stroke="#2a0f0f" stroke-width="5" paint-order="stroke">CHOCOLATE KEEN</text>
</svg>
