<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Open Golf - 3D mini golf">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a2b"/>
      <stop offset="0.6" stop-color="#0e2a3a"/>
      <stop offset="1" stop-color="#123a2e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e9b4a"/>
      <stop offset="1" stop-color="#2c6b30"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c7a3d"/>
      <stop offset="1" stop-color="#24522a"/>
    </linearGradient>
    <linearGradient id="power" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ddf6a"/>
      <stop offset="0.45" stop-color="#f2d13b"/>
      <stop offset="0.75" stop-color="#e2603a"/>
      <stop offset="1" stop-color="#a81f1f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="70" cy="46" r="1.4"/>
    <circle cx="150" cy="90" r="1"/>
    <circle cx="520" cy="40" r="1.6"/>
    <circle cx="470" cy="100" r="1"/>
    <circle cx="330" cy="60" r="1.2"/>
    <circle cx="255" cy="30" r="1"/>
  </g>

  <!-- distant hills -->
  <path d="M0 250 Q120 190 250 245 T600 230 V400 H0 Z" fill="url(#hill)" opacity="0.85"/>

  <!-- fairway / green -->
  <path d="M0 300 Q150 268 300 292 T600 286 V400 H0 Z" fill="url(#green)"/>
  <ellipse cx="470" cy="330" rx="150" ry="46" fill="#57a84e" opacity="0.7"/>

  <!-- sand bunker -->
  <ellipse cx="140" cy="352" rx="70" ry="18" fill="#d8c286" opacity="0.9"/>

  <!-- hole with flag -->
  <g>
    <ellipse cx="480" cy="318" rx="13" ry="5" fill="#0a0a0a"/>
    <rect x="479" y="252" width="3" height="66" fill="#e8e8e8"/>
    <path d="M482 254 L528 268 L482 284 Z" fill="#e2453a"/>
    <circle cx="480.5" cy="251" r="3" fill="#f5c93c"/>
  </g>

  <!-- aim line: power gradient from ball toward hole -->
  <path d="M150 318 L468 318" stroke="url(#power)" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
  <path d="M150 318 L468 318" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="10 9" opacity="0.55"/>

  <!-- golf ball -->
  <circle cx="150" cy="318" r="11" fill="#ffffff"/>
  <circle cx="146" cy="314" r="3" fill="#d9dee3" opacity="0.8"/>

  <!-- putter club -->
  <g transform="rotate(-24 196 300)">
    <rect x="188" y="238" width="6" height="86" rx="3" fill="#9aa4ad"/>
    <rect x="180" y="320" width="22" height="8" rx="4" transform="rotate(90 191 324)" fill="#7d8890"/>
    <path d="M182 344 h18 v10 a4 4 0 0 1 -4 4 h-10 a4 4 0 0 1 -4 -4 Z" fill="#5b656d"/>
  </g>

  <!-- power pips -->
  <g>
    <rect x="238" y="332" width="16" height="5" rx="2.5" fill="#7ddf6a"/>
    <rect x="300" y="332" width="16" height="5" rx="2.5" fill="#f2d13b"/>
    <rect x="362" y="332" width="16" height="5" rx="2.5" fill="#e2603a"/>
  </g>

  <!-- HUD strip -->
  <g>
    <rect x="0" y="0" width="600" height="26" fill="#000000" opacity="0.35"/>
    <text x="12" y="19" font-family="ui-monospace, monospace" font-size="15" fill="#d7f5dd">HOLE 1 · PAR 2</text>
    <text x="588" y="19" font-family="ui-monospace, monospace" font-size="15" fill="#d7f5dd" text-anchor="end">STROKES 0</text>
  </g>

  <text x="300" y="384" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="3" fill="#ffffff" stroke="#0a1a2b" stroke-width="5" paint-order="stroke">OPEN GOLF</text>
</svg>
