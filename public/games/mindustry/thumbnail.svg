<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="Mindustry Classic thumbnail">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="belt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="225" fill="url(#bg)"/>

  <!-- subtle grid floor -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="190" x2="400" y2="190"/>
    <line x1="60" y1="130" x2="30" y2="225"/>
    <line x1="180" y1="130" x2="150" y2="225"/>
    <line x1="300" y1="130" x2="270" y2="225"/>
    <line x1="420" y1="130" x2="390" y2="225"/>
  </g>

  <!-- conveyor belts -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="130" height="14" rx="3" fill="url(#belt)"/>
    <rect x="30" y="4" width="10" height="6" fill="#475569"/>
    <rect x="70" y="4" width="10" height="6" fill="#475569"/>
    <rect x="110" y="4" width="10" height="6" fill="#475569"/>
  </g>
  <g transform="translate(230, 130)">
    <rect x="0" y="0" width="130" height="14" rx="3" fill="url(#belt)"/>
    <rect x="30" y="4" width="10" height="6" fill="#475569"/>
    <rect x="70" y="4" width="10" height="6" fill="#475569"/>
    <rect x="110" y="4" width="10" height="6" fill="#475569"/>
  </g>
  <g transform="translate(160, 95)">
    <rect x="0" y="0" width="80" height="50" rx="3" fill="#475569" opacity="0.8"/>
    <rect x="10" y="10" width="60" height="8" fill="#64748b"/>
    <rect x="10" y="28" width="60" height="8" fill="#64748b"/>
    <circle cx="40" cy="25" r="10" fill="#38bdf8" opacity="0.7"/>
  </g>

  <!-- factory core -->
  <g transform="translate(170, 160)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="url(#core)" stroke="#fbbf24" stroke-width="3"/>
    <rect x="12" y="12" width="36" height="36" rx="4" fill="#78350f" opacity="0.5"/>
    <circle cx="30" cy="30" r="10" fill="#fbbf24"/>
  </g>

  <!-- title -->
  <text x="200" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#f1f5f9" letter-spacing="1">MINDUSTRY</text>
  <text x="200" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="14" fill="#f59e0b" letter-spacing="3">CLASSIC</text>
</svg>
