<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Beatrix thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1030"/>
      <stop offset="0.55" stop-color="#1a0a24"/>
      <stop offset="1" stop-color="#07030d"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- concentric pulse rings -->
  <circle cx="200" cy="140" r="46" fill="url(#pulse)"/>
  <circle cx="200" cy="140" r="70" fill="url(#pulse)" opacity="0.55"/>
  <circle cx="200" cy="140" r="96" fill="url(#pulse)" opacity="0.3"/>

  <!-- audio-reactive bars -->
  <g>
    <rect x="126" y="112" width="12" height="56" rx="6" fill="#ff5fa2"/>
    <rect x="144" y="86"  width="12" height="108" rx="6" fill="#ff8ac4"/>
    <rect x="162" y="126" width="12" height="28" rx="6" fill="#ffd166"/>
    <rect x="180" y="70"  width="12" height="140" rx="6" fill="#4ecdc4"/>
    <rect x="198" y="108" width="12" height="64" rx="6" fill="#7bed9f"/>
    <rect x="216" y="92"  width="12" height="96" rx="6" fill="#ffd166"/>
    <rect x="234" y="122" width="12" height="36" rx="6" fill="#ff8ac4"/>
    <rect x="252" y="104" width="12" height="72" rx="6" fill="#ff5fa2"/>
  </g>

  <!-- waveform baseline -->
  <path d="M120 168 H272" stroke="#ffffff" stroke-width="2" opacity="0.35"/>

  <!-- beat marker -->
  <circle cx="200" cy="140" r="10" fill="#ffffff" opacity="0.9"/>

  <text x="200" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="30" font-weight="bold" fill="#ffe9f3" letter-spacing="8">BEATRIX</text>
  <text x="200" y="250" text-anchor="middle" font-family="Helvetica,Arial,sans-serif"
        font-size="12" fill="#ff9ec7" letter-spacing="3" opacity="0.85">RHYTHM PUZZLE</text>
</svg>